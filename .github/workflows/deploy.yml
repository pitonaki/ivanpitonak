name: Build & Deploy to Webkitty

on:
  push:
    branches:
      - main   # spustí sa automaticky pri každom push na main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Stiahne kód z repozitára
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Nastaví Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 3. Nainštaluje závislosti
      - name: Install dependencies
        run: npm install

      # 4. Zbuilduje projekt (vytvorí /dist priečinok)
      - name: Build
        run: npm run build

      # 5. Pošle /dist na Webkitty cez FTP
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Zmaže staré súbory na serveri pred nahraním nových
          dangerous-clean-slate: true
